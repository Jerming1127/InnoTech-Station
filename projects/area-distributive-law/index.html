<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>從面積看分配律</title>
<style>
  :root {
    --paper: #f3eee4;
    --paper-2: #e8e0d2;
    --ink: #161616;
    --ink-soft: #3d3d3d;
    --muted: #5a564c;
    --whole: #e2cc7a;
    --yellow: #f0d157;
    --blue: #8ec5dc;
    --cut: #c45c26;
    --hatch: #6a8ea0;
    --hatch-red: #c62828;
    --cut-fill: #f6d6d0;
    --btn: #161616;
    --btn-face: #f3eee4;
    --sans: "Microsoft JhengHei", "微軟正黑體", "Noto Sans CJK TC", "Noto Sans CJK HK",
            "Noto Sans TC", "Source Han Sans TC", "Source Han Sans TW", "PingFang TC", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    color: var(--ink);
    font-family: var(--sans);
    background:
      radial-gradient(1200px 800px at 50% 0%, #f7f3ea 0%, var(--paper) 55%, var(--paper-2) 100%);
    overflow: hidden;
    user-select: none;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: .7rem 1.4rem 0;
  }
  header h1 {
    margin: 0;
    font-size: clamp(1rem, 1.8vw, 1.35rem);
    font-weight: 700;
    letter-spacing: .04em;
  }
  .progress {
    margin: 0;
    font-size: clamp(1.05rem, 2vw, 1.45rem);
    font-weight: 700;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .progress .now { color: var(--ink); font-size: 1.15em; }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: .2rem 1.2rem .25rem;
    cursor: pointer;
  }

  .stage {
    width: min(96vw, 1180px);
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fig {
    width: 100%;
    height: 100%;
    max-height: 54vh;
    overflow: visible;
  }

  .fig text {
    fill: var(--ink);
    font-family: var(--sans);
    font-weight: 700;
  }
  .fig .var { font-style: italic; font-weight: 700; }
  .fig .vertex {
    font-size: 28px;
    font-style: italic;
    font-weight: 700;
  }
  .fig .dim-label { font-size: 32px; }
  .fig .piece-name { font-size: 40px; font-style: italic; }
  .fig .area-in { font-size: 36px; }
  .fig .op { font-size: 54px; font-weight: 700; }
  .fig .meth-title { font-size: 34px; }
  .fig .meth-term { font-size: 72px; white-space: pre; }
  .fig .meth-prod { font-size: 30px; fill: var(--cut); }

  #cut-line {
    stroke: var(--cut);
    stroke-width: 3.5;
    stroke-dasharray: 10 8;
    fill: none;
    opacity: 0;
    transition: opacity .35s ease;
  }
  #scissors { opacity: 0; transition: opacity .35s ease; }

  #rect-I, #rect-II {
    fill: var(--whole);
    transition: fill .4s ease, x .4s ease;
  }
  #outer-stroke {
    fill: none;
    stroke: var(--ink);
    stroke-width: 3.5;
    transition: opacity .3s ease;
  }
  .piece-stroke {
    fill: none;
    stroke: var(--ink);
    stroke-width: 3.5;
    opacity: 0;
    transition: opacity .3s ease;
  }

  #dim-xy, #dim-k-whole { opacity: 1; transition: opacity .3s ease; }
  #dim-x, #dim-y, #dim-k-I,
  #label-I, #label-II, #area-I, #area-II, #area-whole {
    opacity: 0;
    transition: opacity .3s ease;
  }

  #scene-add, #scene-sub, #scene-method { transition: opacity .3s ease; }
  #scene-sub, #scene-method { opacity: 0; pointer-events: none; }
  #scene-add { opacity: 1; }

  body.is-split #rect-I { fill: var(--yellow); }
  body.is-split #rect-II { fill: var(--blue); }
  body.is-split #outer-stroke { opacity: 0; }
  body.is-split .piece-stroke { opacity: 1; }
  body.is-split #cut-line,
  body.is-split #scissors { opacity: 1; }
  body.is-split #dim-k-whole { opacity: 0; }
  body.is-split #dim-k-I { opacity: 1; }
  body.is-split #dim-xy { opacity: 0; }

  body.show-split-dims #dim-x,
  body.show-split-dims #dim-y { opacity: 1; }

  body.show-whole-area #area-whole { opacity: 1; }
  body.show-names #label-I,
  body.show-names #label-II { opacity: 1; }
  body.show-areas #area-I,
  body.show-areas #area-II { opacity: 1; }
  body.show-areas #label-I,
  body.show-areas #label-II { transform: translateY(-18px); }

  body.scene-sub #scene-add,
  body.scene-method #scene-add { opacity: 0; pointer-events: none; }
  body.scene-sub #scene-sub { opacity: 1; pointer-events: auto; }
  body.scene-method #scene-method { opacity: 1; pointer-events: auto; }

  #sub-op-minus, #sub-cut,
  #sub-op-eq, #sub-remain {
    opacity: 0;
    transition: opacity .35s ease;
  }
  body.show-sub-cut #sub-op-minus,
  body.show-sub-cut #sub-cut { opacity: 1; }
  body.show-sub-remain #sub-op-eq,
  body.show-sub-remain #sub-remain { opacity: 1; }

  #method-ex1, #method-ex2 { transition: opacity .3s ease; }
  #method-ex2 { opacity: 0; }
  body.method-ex2 #method-ex1 { opacity: 0; }
  body.method-ex2 #method-ex2 { opacity: 1; }

  .meth-arrow, .meth-eq {
    opacity: 0;
    transition: opacity .35s ease;
  }
  body.show-arrow-1 .meth-arrow-1 { opacity: 1; }
  body.show-arrow-2 .meth-arrow-2 { opacity: 1; }
  body.show-method-eq .meth-eq { opacity: 1; }

  .caption {
    flex: 0 0 auto;
    margin: .1rem 0 0;
    max-width: min(92vw, 1100px);
    text-align: center;
  }
  .prompt {
    margin: 0;
    font-size: clamp(1.3rem, 2.7vw, 2.15rem);
    font-weight: 700;
    line-height: 1.45;
    min-height: 2.9em;
  }
  .prompt .eq {
    display: inline-block;
    margin: 0 .05em;
    font-size: 1.12em;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .prompt var, .eq var {
    font-style: italic;
    font-weight: 700;
    font-family: var(--sans);
  }
  .prompt .rule {
    display: block;
    margin-top: .3em;
    font-size: .8em;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
  }
  .discuss {
    margin: .28rem 0 0;
    font-size: clamp(1.05rem, 2vw, 1.3rem);
    font-weight: 700;
    color: var(--muted);
    visibility: hidden;
  }
  body.has-discuss .discuss { visibility: visible; }

  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: .7rem 1rem;
    padding: .5rem 1.2rem .95rem;
  }
  footer .btns {
    display: flex;
    gap: .6rem;
  }
  button {
    font-family: inherit;
    font-size: clamp(1.05rem, 1.8vw, 1.3rem);
    font-weight: 700;
    line-height: 1;
    padding: .55rem 1.15rem;
    border: 2.5px solid var(--btn);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    border-radius: 2px;
  }
  button:hover, button:focus-visible {
    background: rgba(22, 22, 22, .06);
    outline: none;
  }
  button:focus-visible { outline: 3px solid var(--cut); outline-offset: 2px; }
  button#next {
    background: var(--btn);
    color: var(--btn-face);
  }
  button#next:hover, button#next:focus-visible {
    background: #000;
  }
  button:disabled {
    opacity: .32;
    cursor: default;
  }
  button.ghost { border-color: #7a756a; color: var(--ink-soft); }
  .hint {
    margin: 0;
    font-size: .9rem;
    color: var(--muted);
  }

  @media (max-height: 700px) {
    .fig { max-height: 48vh; }
    .prompt { font-size: clamp(1.15rem, 2.5vw, 1.7rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  html.no-motion * { transition: none !important; }

  #goals {
    display: none;
    width: min(90vw, 860px);
    padding: .4rem .6rem 1rem;
    text-align: left;
  }
  body.scene-goals .fig { display: none; }
  body.scene-goals #goals { display: block; }
  body.scene-goals .caption { display: none; }

  #goals h2 {
    margin: 0 0 .9rem;
    font-size: clamp(1.4rem, 3vw, 2.15rem);
    font-weight: 700;
    letter-spacing: .06em;
    text-align: center;
  }
  #goals .lead {
    margin: 0 0 .75rem;
    font-size: clamp(1.15rem, 2.3vw, 1.55rem);
    font-weight: 700;
    text-align: center;
    color: var(--ink-soft);
  }
  #goals ol {
    margin: 0 auto;
    padding: 0 0 0 1.5em;
    max-width: 42em;
  }
  #goals li {
    margin: .55em 0;
    font-size: clamp(1.15rem, 2.4vw, 1.7rem);
    font-weight: 700;
    line-height: 1.55;
  }
  #goals .eq {
    display: inline-block;
    margin: 0 .05em;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  #goals var {
    font-style: italic;
    font-weight: 700;
    font-family: var(--sans);
  }
</style>
</head>
<body data-step="0" data-frame="0">
  <header>
    <h1>從面積看分配律</h1>
    <p class="progress" id="progress">學習目標</p>
  </header>

  <main id="main" aria-live="polite">
    <div class="stage">
      <section id="goals" aria-label="本課學習目標">
        <h2>本課學習目標</h2>
        <p class="lead">完成本課後，我能夠：</p>
        <ol>
          <li>用長方形分割，說明為甚麼 <span class="eq"><var>k</var>(<var>x</var> + <var>y</var>) = <var>kx</var> + <var>ky</var>。</span></li>
          <li>正確展開 <span class="eq"><var>k</var>(<var>x</var> + <var>y</var>)</span> 和 <span class="eq"><var>k</var>(<var>x</var> − <var>y</var>)</span> 這類代數式，<br>並小心處理括號內的加減和正負號。</li>
        </ol>
      </section>
      <svg class="fig" viewBox="0 0 960 500" role="img" aria-labelledby="prompt">
        <defs>
          <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="10" stroke="var(--hatch)" stroke-width="2.5"/>
          </pattern>
          <pattern id="hatch-red" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="12" stroke="var(--hatch-red)" stroke-width="2.6"/>
          </pattern>
          <marker id="arrow-head" markerWidth="10" markerHeight="8" refX="8.2" refY="4" orient="auto">
            <path d="M0,0 L10,4 L0,8 Z" fill="var(--cut)"/>
          </marker>
        </defs>

        <!-- 步驟 1–4、5.0：和的長方形 -->
        <g id="scene-add">
          <g id="dim-xy">
            <line x1="200" y1="118" x2="200" y2="138" stroke="var(--ink)" stroke-width="3"/>
            <line x1="720" y1="118" x2="720" y2="138" stroke="var(--ink)" stroke-width="3"/>
            <line x1="200" y1="128" x2="720" y2="128" stroke="var(--ink)" stroke-width="3"/>
            <text class="dim-label" x="460" y="104" text-anchor="middle">
              (<tspan class="var">x</tspan> + <tspan class="var">y</tspan>)
            </text>
          </g>
          <g id="dim-x">
            <line x1="200" y1="118" x2="200" y2="138" stroke="var(--ink)" stroke-width="3"/>
            <line x1="400" y1="118" x2="400" y2="138" stroke="var(--ink)" stroke-width="3"/>
            <line x1="200" y1="128" x2="400" y2="128" stroke="var(--ink)" stroke-width="3"/>
            <text class="dim-label var" x="300" y="104" text-anchor="middle">x</text>
          </g>
          <g id="dim-y">
            <line x1="400" y1="118" x2="400" y2="138" stroke="var(--ink)" stroke-width="3"/>
            <line x1="720" y1="118" x2="720" y2="138" stroke="var(--ink)" stroke-width="3"/>
            <line x1="400" y1="128" x2="720" y2="128" stroke="var(--ink)" stroke-width="3"/>
            <text class="dim-label var" x="560" y="104" text-anchor="middle">y</text>
          </g>

          <g id="dim-k-whole">
            <line x1="172" y1="150" x2="188" y2="150" stroke="var(--ink)" stroke-width="3"/>
            <line x1="172" y1="360" x2="188" y2="360" stroke="var(--ink)" stroke-width="3"/>
            <line x1="180" y1="150" x2="180" y2="360" stroke="var(--ink)" stroke-width="3"/>
            <text class="dim-label var" x="152" y="264" text-anchor="middle">k</text>
          </g>
          <g id="dim-k-I">
            <line x1="172" y1="150" x2="188" y2="150" stroke="var(--ink)" stroke-width="3"/>
            <line x1="172" y1="360" x2="188" y2="360" stroke="var(--ink)" stroke-width="3"/>
            <line x1="180" y1="150" x2="180" y2="360" stroke="var(--ink)" stroke-width="3"/>
            <text class="dim-label var" x="152" y="264" text-anchor="middle">k</text>
          </g>

          <rect id="rect-I" x="200" y="150" width="201" height="210"/>
          <g id="wing-II">
            <rect id="rect-II" x="400" y="150" width="320" height="210"/>
            <rect class="piece-stroke" id="stroke-II" x="400" y="150" width="320" height="210"/>
            <text id="label-II" class="piece-name" x="560" y="248" text-anchor="middle">II</text>
            <text id="area-II" class="area-in" x="560" y="296" text-anchor="middle">
              <tspan class="var">ky</tspan>
            </text>
            <text id="vertex-D" class="vertex" x="738" y="144">D</text>
            <text id="vertex-C" class="vertex" x="738" y="388">C</text>
          </g>
          <rect id="outer-stroke" x="200" y="150" width="520" height="210"/>
          <rect class="piece-stroke" x="200" y="150" width="200" height="210"/>

          <g id="cut-g">
            <line id="cut-line" x1="400" y1="150" x2="400" y2="360"/>
            <g id="scissors" transform="translate(411 378)">
              <circle cx="-7" cy="10" r="6.5" fill="none" stroke="var(--cut)" stroke-width="2.4"/>
              <circle cx="7" cy="10" r="6.5" fill="none" stroke="var(--cut)" stroke-width="2.4"/>
              <path d="M-3 5 L0 -8 L3 5" fill="none" stroke="var(--cut)" stroke-width="2.4" stroke-linejoin="round"/>
              <line x1="0" y1="-8" x2="0" y2="4" stroke="var(--cut)" stroke-width="2.2"/>
            </g>
          </g>

          <text id="vertex-A" class="vertex" x="178" y="144" text-anchor="end">A</text>
          <text id="vertex-B" class="vertex" x="178" y="388" text-anchor="end">B</text>

          <text id="area-whole" class="area-in" x="460" y="268" text-anchor="middle">
            <tspan class="var">k</tspan>(<tspan class="var">x</tspan> + <tspan class="var">y</tspan>)
          </text>
          <text id="label-I" class="piece-name" x="300" y="248" text-anchor="middle">I</text>
          <text id="area-I" class="area-in" x="300" y="296" text-anchor="middle">
            <tspan class="var">kx</tspan>
          </text>
        </g>

        <!-- 步驟 5：kx − ky = k(x−y)。三塊闊度按 x = (x−y) + y 畫 380、260、120 -->
        <g id="scene-sub">
          <g transform="translate(8 22) scale(0.86)">
            <g id="sub-whole">
              <line x1="28" y1="150" x2="44" y2="150" stroke="var(--ink)" stroke-width="3"/>
              <line x1="28" y1="350" x2="44" y2="350" stroke="var(--ink)" stroke-width="3"/>
              <line x1="36" y1="150" x2="36" y2="350" stroke="var(--ink)" stroke-width="3"/>
              <text class="dim-label var" x="14" y="258" text-anchor="middle">k</text>
              <line x1="56" y1="118" x2="56" y2="138" stroke="var(--ink)" stroke-width="3"/>
              <line x1="436" y1="118" x2="436" y2="138" stroke="var(--ink)" stroke-width="3"/>
              <line x1="56" y1="128" x2="436" y2="128" stroke="var(--ink)" stroke-width="3"/>
              <text class="dim-label var" x="246" y="104" text-anchor="middle">x</text>
              <rect x="56" y="150" width="380" height="200" fill="var(--whole)" stroke="var(--ink)" stroke-width="3.5"/>
              <text class="area-in" x="246" y="258" text-anchor="middle">
                <tspan class="var">kx</tspan>
              </text>
            </g>
            <text id="sub-op-minus" class="op" x="464" y="268" text-anchor="middle">−</text>
            <g id="sub-cut">
              <line x1="492" y1="118" x2="492" y2="138" stroke="var(--ink)" stroke-width="3"/>
              <line x1="612" y1="118" x2="612" y2="138" stroke="var(--ink)" stroke-width="3"/>
              <line x1="492" y1="128" x2="612" y2="128" stroke="var(--ink)" stroke-width="3"/>
              <text class="dim-label var" x="552" y="104" text-anchor="middle">y</text>
              <rect x="492" y="150" width="120" height="200" fill="var(--cut-fill)" stroke="var(--ink)" stroke-width="3.5"/>
              <rect x="492" y="150" width="120" height="200" fill="url(#hatch-red)" stroke="var(--ink)" stroke-width="3.5"/>
              <text class="area-in" x="552" y="258" text-anchor="middle">
                <tspan class="var">ky</tspan>
              </text>
            </g>
            <text id="sub-op-eq" class="op" x="644" y="268" text-anchor="middle">=</text>
            <g id="sub-remain">
              <line x1="674" y1="118" x2="674" y2="138" stroke="var(--ink)" stroke-width="3" stroke-dasharray="8 7"/>
              <line x1="1054" y1="118" x2="1054" y2="138" stroke="var(--ink)" stroke-width="3" stroke-dasharray="8 7"/>
              <line x1="674" y1="128" x2="1054" y2="128" stroke="var(--ink)" stroke-width="3" stroke-dasharray="8 7"/>
              <text class="dim-label var" x="864" y="104" text-anchor="middle">x</text>
              <rect x="674" y="150" width="260" height="200" fill="var(--yellow)" stroke="var(--ink)" stroke-width="3.5"/>
              <text class="area-in" x="804" y="258" text-anchor="middle">
                <tspan class="var">k</tspan>(<tspan class="var">x</tspan> − <tspan class="var">y</tspan>)
              </text>
              <rect x="934" y="150" width="120" height="200" fill="var(--cut-fill)" fill-opacity="0.45" stroke="var(--hatch-red)" stroke-width="3" stroke-dasharray="10 8"/>
              <rect x="934" y="150" width="120" height="200" fill="url(#hatch-red)" fill-opacity="0.7" stroke="none"/>
              <text class="area-in" x="994" y="258" text-anchor="middle" fill="var(--hatch-red)">
                <tspan class="var">ky</tspan>
              </text>
              <line x1="674" y1="368" x2="674" y2="388" stroke="var(--ink)" stroke-width="3"/>
              <line x1="934" y1="368" x2="934" y2="388" stroke="var(--ink)" stroke-width="3"/>
              <line x1="674" y1="378" x2="934" y2="378" stroke="var(--ink)" stroke-width="3"/>
              <text class="dim-label" x="804" y="422" text-anchor="middle">
                (<tspan class="var">x</tspan> − <tspan class="var">y</tspan>)
              </text>
              <line x1="934" y1="368" x2="934" y2="388" stroke="var(--ink)" stroke-width="3" stroke-dasharray="8 7"/>
              <line x1="1054" y1="368" x2="1054" y2="388" stroke="var(--ink)" stroke-width="3" stroke-dasharray="8 7"/>
              <line x1="934" y1="378" x2="1054" y2="378" stroke="var(--ink)" stroke-width="3" stroke-dasharray="8 7"/>
              <text class="dim-label var" x="994" y="422" text-anchor="middle" fill="var(--hatch-red)">y</text>
            </g>
          </g>
        </g>

        <!-- 步驟 6–7：做法（箭嘴乘入） -->
        <g id="scene-method">
          <text class="meth-title" x="480" y="48" text-anchor="middle">做法</text>
          <line x1="430" y1="62" x2="530" y2="62" stroke="var(--ink)" stroke-width="2.5"/>

          <g id="method-ex1">
            <text class="meth-term" id="m1-expr" x="480" y="278" text-anchor="middle" xml:space="preserve">
              <tspan id="m1-k">3</tspan>(<tspan id="m1-a" class="var">x</tspan> + <tspan id="m1-b">2</tspan>)<tspan class="meth-eq"> = 3<tspan class="var">x</tspan> + 6</tspan>
            </text>
            <g class="meth-arrow meth-arrow-1">
              <path id="m1-arr1-p" fill="none" stroke="var(--cut)" stroke-width="3" marker-end="url(#arrow-head)"/>
              <text class="meth-prod" id="m1-arr1-t" text-anchor="middle">3×<tspan class="var">x</tspan></text>
            </g>
            <g class="meth-arrow meth-arrow-2">
              <path id="m1-arr2-p" fill="none" stroke="var(--cut)" stroke-width="3" marker-end="url(#arrow-head)"/>
              <text class="meth-prod" id="m1-arr2-t" text-anchor="middle">3×2</text>
            </g>
          </g>

          <g id="method-ex2">
            <text class="meth-term" id="m2-expr" x="480" y="278" text-anchor="middle" xml:space="preserve">
              <tspan id="m2-k">5</tspan>(<tspan id="m2-a">2<tspan class="var">x</tspan></tspan> <tspan id="m2-b">− 3</tspan>)<tspan class="meth-eq"> = 10<tspan class="var">x</tspan> − 15</tspan>
            </text>
            <g class="meth-arrow meth-arrow-1">
              <path id="m2-arr1-p" fill="none" stroke="var(--cut)" stroke-width="3" marker-end="url(#arrow-head)"/>
              <text class="meth-prod" id="m2-arr1-t" text-anchor="middle">5×2<tspan class="var">x</tspan></text>
            </g>
            <g class="meth-arrow meth-arrow-2">
              <path id="m2-arr2-p" fill="none" stroke="var(--cut)" stroke-width="3" marker-end="url(#arrow-head)"/>
              <text class="meth-prod" id="m2-arr2-t" text-anchor="middle">5×(−3)</text>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <div class="caption">
      <p class="prompt" id="prompt">這個長方形的長和闊分別是甚麼？</p>
      <p class="discuss" id="discuss">請分組討論後作答</p>
    </div>
  </main>

  <footer>
    <div class="btns">
      <button type="button" id="prev" disabled>上一步</button>
      <button type="button" id="next">下一步</button>
      <button type="button" id="reset" class="ghost">重設</button>
      <button type="button" id="full" class="ghost">全螢幕</button>
    </div>
    <p class="hint">方向鍵、空白鍵或點畫面到下一步；先提問，再按鍵揭示。Home 重設。</p>
  </footer>

<script>
(function () {
  const body = document.body;
  const promptEl = document.getElementById("prompt");
  const progressEl = document.getElementById("progress");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const resetBtn = document.getElementById("reset");
  const fullBtn = document.getElementById("full");
  const wingII = document.getElementById("wing-II");
  const dimY = document.getElementById("dim-y");
  const cutG = document.getElementById("cut-g");

  const eq = (html) => `<span class="eq">${html}</span>`;
  const v = (s) => `<var>${s}</var>`;
  const TOTAL = 7;

  const frames = [
    {
      major: 0, discuss: false, scene: "goals",
      prompt: "",
      flags: {}
    },
    {
      major: 1, discuss: true, scene: "add",
      prompt: "這個長方形的長和闊分別是甚麼？",
      flags: {}
    },
    {
      major: 1, discuss: false, scene: "add",
      prompt: "長是 " + eq("(" + v("x") + " + " + v("y") + ")") + "，闊是 " + eq(v("k") + "。"),
      flags: {}
    },
    {
      major: 2, discuss: true, scene: "add",
      prompt: "這個長方形的面積可以怎樣表示？",
      flags: {}
    },
    {
      major: 2, discuss: false, scene: "add",
      prompt: "面積是 " + eq(v("k") + "(" + v("x") + " + " + v("y") + ")。"),
      flags: { wholeArea: true }
    },
    {
      major: 3, discuss: true, scene: "add",
      prompt: "沿虛線把長方形分成 I、II 兩塊。<br>切開之後，兩塊的長和闊分別是甚麼？",
      flags: { split: true, names: true }
    },
    {
      major: 3, discuss: false, scene: "add",
      prompt: "長方形 I 的長是 " + eq(v("x")) + "、闊是 " + eq(v("k")) + "；<br>長方形 II 的長是 " + eq(v("y")) + "、闊是 " + eq(v("k") + "。"),
      flags: { split: true, names: true, splitDims: true }
    },
    {
      major: 3, discuss: true, scene: "add",
      prompt: "那麼，兩塊的面積分別是甚麼？",
      flags: { split: true, names: true, splitDims: true }
    },
    {
      major: 3, discuss: false, scene: "add",
      prompt: "長方形 I 的面積是 " + eq(v("kx")) + "，長方形 II 的面積是 " + eq(v("ky") + "。"),
      flags: { split: true, names: true, splitDims: true, areas: true }
    },
    {
      major: 4, discuss: true, scene: "add",
      prompt: "為甚麼這兩塊的面積加起來等於原來長方形的面積？",
      flags: { split: true, names: true, splitDims: true, areas: true }
    },
    {
      major: 4, discuss: false, scene: "add",
      prompt: "整塊的面積等於 I 的面積加 II 的面積，所以<br>" +
              eq(v("k") + "(" + v("x") + " + " + v("y") + ") = " + v("kx") + " + " + v("ky") + "。"),
      flags: { split: true, names: true, splitDims: true, areas: true }
    },
    {
      major: 5, discuss: true, scene: "add",
      prompt: "如果把加號改成減號，會怎樣？",
      flags: { split: true, names: true, splitDims: true, areas: true }
    },
    {
      major: 5, discuss: true, scene: "sub",
      prompt: "長為 " + v("x") + "、闊為 " + v("k") + " 的長方形，面積為 " + eq(v("kx")) + "。<br>若減去長為 " + v("y") + " 的一塊，被減去的那塊面積怎樣表示？",
      flags: {}
    },
    {
      major: 5, discuss: true, scene: "sub",
      prompt: "被減去的一塊面積是 " + eq(v("ky") + "。") + "<br>剩餘部分的長是甚麼？剩餘面積怎樣表示？",
      flags: { subCut: true }
    },
    {
      major: 5, discuss: true, scene: "sub",
      prompt: "剩餘部分的長是 " + eq("(" + v("x") + " − " + v("y") + ")") +
              "，面積是 " + eq(v("k") + "(" + v("x") + " − " + v("y") + ")") + "。<br>為甚麼 " +
              eq(v("kx") + " − " + v("ky")) + " 等於 " +
              eq(v("k") + "(" + v("x") + " − " + v("y") + ")") + "？",
      flags: { subCut: true, subRemain: true }
    },
    {
      major: 5, discuss: false, scene: "sub",
      prompt: "左邊是整塊減去 " + eq(v("ky")) + "，右邊是剩餘的一塊，因此<br>" +
              eq(v("kx") + " − " + v("ky") + " = " + v("k") + "(" + v("x") + " − " + v("y") + ")") + "。",
      flags: { subCut: true, subRemain: true }
    },
    {
      major: 6, discuss: false, scene: "method",
      prompt: "面積圖用來說明分配律為甚麼成立。<br>實際運算時，用箭嘴把括號外的數乘入括號內的每一項。",
      flags: { methodEx: 1 }
    },
    {
      major: 6, discuss: true, scene: "method",
      prompt: "先看 " + eq("3(" + v("x") + " + 2)") + "。<br>第一步，箭嘴應該把 3 乘哪一項？",
      flags: { methodEx: 1 }
    },
    {
      major: 6, discuss: true, scene: "method",
      prompt: "先把 3 乘入 " + eq(v("x")) + "，得 " + eq("3×" + v("x") + "。") + "<br>第二條箭嘴應該乘哪一項？",
      flags: { methodEx: 1, arrow1: true }
    },
    {
      major: 6, discuss: true, scene: "method",
      prompt: "再把 3 乘入 2，得 " + eq("3×2。") + "<br>那麼，展開式是甚麼？",
      flags: { methodEx: 1, arrow1: true, arrow2: true }
    },
    {
      major: 6, discuss: false, scene: "method",
      prompt: "因此 " + eq("3(" + v("x") + " + 2) = 3" + v("x") + " + 6。"),
      flags: { methodEx: 1, arrow1: true, arrow2: true, methodEq: true }
    },
    {
      major: 7, discuss: true, scene: "method",
      prompt: "再看帶減號的例子 " + eq("5(2" + v("x") + " − 3)") + "。<br>第一步，箭嘴應該把 5 乘哪一項？",
      flags: { methodEx: 2 }
    },
    {
      major: 7, discuss: true, scene: "method",
      prompt: "先把 5 乘入 " + eq("2" + v("x")) + "，得 " + eq("5×2" + v("x") + "。") +
              "<br>第二條箭嘴應該乘哪一項？須怎樣處理減號？",
      flags: { methodEx: 2, arrow1: true }
    },
    {
      major: 7, discuss: true, scene: "method",
      prompt: "再把 5 乘入 −3，得 " + eq("5×(−3)。") + "<br>那麼，展開式是甚麼？",
      flags: { methodEx: 2, arrow1: true, arrow2: true }
    },
    {
      major: 7, discuss: false, scene: "method",
      prompt: "因此 " + eq("5(2" + v("x") + " − 3) = 10" + v("x") + " − 15。") +
              "<span class=\"rule\">括號外的因式須乘以括號內的每一項，並注意符號。</span>",
      flags: { methodEx: 2, arrow1: true, arrow2: true, methodEq: true }
    }
  ];

  let i = 0;

  (function applyStartFrame() {
    const params = new URLSearchParams(location.search);
    const raw = params.get("f");
    if (raw !== null) {
      const n = parseInt(raw, 10);
      if (!isNaN(n)) i = Math.max(0, Math.min(frames.length - 1, n));
      document.documentElement.classList.add("no-motion");
    }
  })();

  function render() {
    const f = frames[i];
    const flags = f.flags || {};
    body.dataset.step = String(f.major);
    body.dataset.frame = String(i);
    if (f.scene === "goals") {
      progressEl.textContent = "學習目標";
    } else {
      progressEl.innerHTML = "第 <span class=\"now\" id=\"step-now\">" + f.major + "</span>／" + TOTAL + " 步";
    }

    body.classList.remove(
      "is-split", "show-whole-area", "show-names", "show-areas", "show-split-dims",
      "scene-sub", "scene-method", "show-sub-cut", "show-sub-remain",
      "method-ex2", "show-arrow-1", "show-arrow-2", "show-method-eq", "has-discuss",
      "scene-goals"
    );

    const splitOn = !!flags.split;
    const dx = splitOn ? "translate(22 0)" : "";
    if (wingII) wingII.setAttribute("transform", dx);
    if (dimY) dimY.setAttribute("transform", dx);
    if (cutG) cutG.setAttribute("transform", splitOn ? "translate(11 0)" : "");

    if (flags.wholeArea) body.classList.add("show-whole-area");
    if (splitOn) body.classList.add("is-split");
    if (flags.names) body.classList.add("show-names");
    if (flags.splitDims) body.classList.add("show-split-dims");
    if (flags.areas) body.classList.add("show-areas");
    if (f.scene === "goals") body.classList.add("scene-goals");
    if (f.scene === "sub") body.classList.add("scene-sub");
    if (flags.subCut) body.classList.add("show-sub-cut");
    if (flags.subRemain) body.classList.add("show-sub-remain");
    if (f.scene === "method") body.classList.add("scene-method");
    if (flags.methodEx === 2) body.classList.add("method-ex2");
    if (flags.arrow1) body.classList.add("show-arrow-1");
    if (flags.arrow2) body.classList.add("show-arrow-2");
    if (flags.methodEq) body.classList.add("show-method-eq");
    if (f.discuss) body.classList.add("has-discuss");

    promptEl.innerHTML = f.prompt;
    prevBtn.disabled = (i === 0);
    nextBtn.disabled = (i === frames.length - 1);
    layoutArrows();
  }

  function layoutArrows() {
    ["m1", "m2"].forEach(function (prefix) {
      const k = document.getElementById(prefix + "-k");
      const a = document.getElementById(prefix + "-a");
      const b = document.getElementById(prefix + "-b");
      const p1 = document.getElementById(prefix + "-arr1-p");
      const t1 = document.getElementById(prefix + "-arr1-t");
      const p2 = document.getElementById(prefix + "-arr2-p");
      const t2 = document.getElementById(prefix + "-arr2-t");
      if (!k || !a || !b || !p1 || !p2) return;
      const bk = k.getBBox(), ba = a.getBBox(), bb = b.getBBox();
      const kx = bk.x + bk.width / 2;
      const ax = ba.x + ba.width / 2;
      const bx = bb.x + bb.width / 2;
      const ky = bk.y;
      const kyb = bk.y + bk.height;
      const ay = ba.y;
      const by = bb.y + bb.height;
      const rise = 92;
      const bulge = (ax - kx) < 90 ? 30 : 0;
      p1.setAttribute("d",
        "M" + kx + " " + (ky - 6) +
        " C" + (kx - bulge) + " " + (ky - rise) + ", " + (ax + bulge * 0.15) + " " + (ay - rise) + ", " + ax + " " + (ay - 8));
      t1.setAttribute("x", (kx + ax) / 2);
      t1.setAttribute("y", Math.min(ky, ay) - rise - 4);
      p2.setAttribute("d",
        "M" + kx + " " + (kyb + 6) +
        " C" + kx + " " + (kyb + rise) + ", " + bx + " " + (by + rise) + ", " + bx + " " + (by + 8));
      t2.setAttribute("x", (kx + bx) / 2);
      t2.setAttribute("y", Math.max(kyb, by) + rise + 26);
    });
  }

  function next() {
    if (i < frames.length - 1) { i += 1; render(); }
  }
  function prev() {
    if (i > 0) { i -= 1; render(); }
  }
  function reset() {
    i = 0;
    render();
  }

  prevBtn.addEventListener("click", function (e) { e.stopPropagation(); prev(); });
  nextBtn.addEventListener("click", function (e) { e.stopPropagation(); next(); });
  resetBtn.addEventListener("click", function (e) { e.stopPropagation(); reset(); });
  fullBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function () {});
    } else {
      document.exitFullscreen().catch(function () {});
    }
  });
  document.getElementById("main").addEventListener("click", function () { next(); });

  window.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || k === " " || k === "Spacebar") {
      e.preventDefault();
      next();
    } else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp" || k === "Backspace") {
      e.preventDefault();
      prev();
    } else if (k === "Home") {
      e.preventDefault();
      reset();
    }
  });

  document.addEventListener("fullscreenchange", function () {
    fullBtn.textContent = document.fullscreenElement ? "離開全螢幕" : "全螢幕";
  });

  render();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { layoutArrows(); });
  }
  window.addEventListener("resize", layoutArrows);
})();
</script>
</body>
</html>
