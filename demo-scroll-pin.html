  <style>
    /* —— lightweight scroll-pin demo (no GSAP) —— */
    .demo-banner {
      position: sticky;
      top: 0;
      z-index: 50;
      margin: 0;
      padding: 0.55rem 1rem;
      font-family: var(--zh), var(--en);
      font-size: 0.85rem;
      text-align: center;
      color: #fff;
      background: #002B54;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .demo-banner a { color: #9ec9ff; }

    /* Tall scene = wheel travel before release (~1.1 viewport) */
    .pin-scene {
      position: relative;
      height: 210vh;
      margin: 0 calc(-1 * clamp(1.5rem, 4vw, 3rem));
      /* bleed to page edges under .page padding */
    }
    .pin-sticky {
      position: sticky;
      top: 72px; /* under top-nav */
      height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 1rem clamp(1.5rem, 4vw, 3rem) 2rem;
      overflow: hidden;
      background: var(--ground-2);
    }
    .pin-sticky .station-board {
      margin: 0;
      padding: 0;
      transform-origin: center center;
      will-change: transform, opacity;
    }
    .pin-sticky .station-board__zh {
      font-size: clamp(4.2rem, 14vw, 7.5rem);
      letter-spacing: 0.14em;
    }
    .pin-sticky .station-board__en {
      margin-top: 0.75rem;
      font-size: clamp(1.35rem, 3vw, 2rem);
    }
    .pin-progress {
      position: absolute;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      width: min(12rem, 40vw);
      height: 3px;
      border-radius: 2px;
      background: rgba(10, 26, 58, 0.12);
      overflow: hidden;
    }
    .pin-progress__bar {
      display: block;
      height: 100%;
      width: 0%;
      background: #002B54;
      border-radius: 2px;
    }
    .pin-after {
      max-width: 60rem;
      margin: 0 auto;
      padding-top: 0.5rem;
    }

    @media (max-width: 720px) {
      .pin-sticky { top: 64px; height: calc(100vh - 64px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pin-scene { height: auto; }
      .pin-sticky {
        position: static;
        height: auto;
        padding: 2rem clamp(1.5rem, 4vw, 3rem);
      }
      .pin-sticky .station-board {
        transform: none !important;
        opacity: 1 !important;
      }
      .pin-progress { display: none; }
    }
  </style>

  <script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  var scene = document.getElementById('pin-scene');
  var board = document.getElementById('pin-board');
  var bar = document.getElementById('pin-bar');
  if (!scene || !board) return;

  var ticking = false;
  function update() {
    ticking = false;
    var rect = scene.getBoundingClientRect();
    var total = scene.offsetHeight - window.innerHeight;
    if (total <= 0) return;
    // progress 0→1 while sticky is pinned (scene top going from 0 to -(total))
    var scrolled = Math.min(Math.max(-rect.top, 0), total);
    var p = scrolled / total;

    // slight settle: scale 1 → 0.92, opacity stays readable
    var scale = 1 - p * 0.08;
    board.style.transform = 'scale(' + scale.toFixed(4) + ')';
    board.style.opacity = String((1 - p * 0.12).toFixed(3));
    if (bar) bar.style.width = (p * 100).toFixed(1) + '%';
  }

  function onScroll() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(update);
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update();
})();
  </script>
