<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>職員區 · 創科站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="staff.css?v=1" />
</head>
<body>
  <div id="staff-gate"></div>

  <div id="staff-app" hidden>
    <div class="wrap">
      <header class="topbar">
        <a class="topbar__brand" href="./">職員區 · 創科站</a>
        <div class="topbar__spacer"></div>
        <div class="topbar__actions">
          <span class="user-chip" id="staff-user-chip" hidden></span>
          <button type="button" class="btn btn-sm" id="btn-logout">登出</button>
        </div>
      </header>

      <h1>職員區</h1>

      <div class="card-grid">
        <a class="app-card" href="leaderboard/">
          <p class="app-card__title">龍虎榜</p>
        </a>
        <a class="app-card" href="progress/">
          <p class="app-card__title">上課日子教學進度表</p>
        </a>
        <a class="app-card" href="timetable/">
          <p class="app-card__title">一週時間表</p>
        </a>
      </div>
    </div>
  </div>

  <script src="auth-config.js"></script>
  <script src="auth.js?v=1"></script>
  <script>
    StaffAuth.requireAuth();
    document.getElementById("btn-logout").addEventListener("click", function () {
      StaffAuth.logout();
      location.reload();
    });
  </script>
</body>
</html>
