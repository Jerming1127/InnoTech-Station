<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>職員區 · 創科站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="staff.css" />
</head>
<body>
  <div id="staff-gate"></div>

  <div id="staff-app" hidden>
    <div class="wrap">
      <header class="topbar">
        <a class="topbar__brand" href="./">職員區 · 創科站</a>
        <div class="topbar__spacer"></div>
        <div class="topbar__actions">
          <span class="user-chip" id="staff-user-chip" hidden></span>
          <button type="button" class="btn btn-sm" id="btn-logout">登出</button>
        </div>
      </header>

      <h1>私人工具</h1>
      <p class="muted">唔喺公開首頁／導覽；請用私人連結分享。須 Google 登入。資料只存本機瀏覽器（進度亦可讀 Sheet）。</p>

      <div class="card-grid">
        <a class="app-card" href="leaderboard/">
          <p class="app-card__title">農虎榜</p>
          <p class="app-card__desc">1A／1B／2A／2B／3B Classroom Rank。點名加分（答啱問題／做啱十集）。無 1C。名單自行輸入。</p>
          <p class="app-card__arrow">開啟 →</p>
        </a>
        <a class="app-card" href="progress/">
          <p class="app-card__title">課堂進度</p>
          <p class="app-card__desc">六班（含 1C）× 18 週矩陣。可接 Google Sheet CSV；未設定則本機編輯。</p>
          <p class="app-card__arrow">開啟 →</p>
        </a>
      </div>

      <p class="footnote">靜態 GitHub Pages：前端允許名單可被閱讀原始碼嘅人睇到；仍然比共用密碼難被學生隨手 hack。</p>
    </div>
  </div>

  <script src="auth-config.js"></script>
  <script src="auth.js"></script>
  <script>
    StaffAuth.requireAuth();
    document.getElementById("btn-logout").addEventListener("click", function () {
      StaffAuth.logout();
      location.reload();
    });
  </script>
</body>
</html>
