<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>上課日子教學進度表 · 職員區</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../staff.css?v=2" />
</head>
<body>
  <div id="staff-gate"></div>

  <div id="staff-app" hidden>
    <div class="wrap wrap--wide wrap--matrix">
      <header class="topbar">
        <a class="topbar__brand" href="../">← 職員區</a>
        <div class="topbar__spacer"></div>
        <div class="topbar__actions">
          <button type="button" class="btn btn-sm" id="btn-reload-sheet" hidden>重新載入 Sheet</button>
          <button type="button" class="btn btn-sm" id="btn-export">匯出本機</button>
          <label class="btn btn-sm" style="cursor:pointer;margin:0" id="btn-import-wrap">
            匯入本機
            <input type="file" id="import-file" accept="application/json,.json" class="sr-only" />
          </label>
          <span class="user-chip" id="staff-user-chip" hidden></span>
          <button type="button" class="btn btn-sm" id="btn-logout">登出</button>
        </div>
      </header>

      <div class="prog-hero">
        <div>
          <h1>上課日子教學進度表</h1>
        </div>
        <p class="stamp" id="mode-stamp">載入中…</p>
      </div>

      <p class="sheet-note" id="sheet-note" hidden></p>

      <div class="matrix-scroll">
        <table class="prog-matrix" id="prog-matrix" aria-label="週次 × 班別（電腦、工場、數學）進度">
          <thead id="matrix-head"></thead>
          <tbody id="matrix-body"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="../auth-config.js"></script>
  <script src="../auth.js?v=1"></script>
  <script src="progress-config.js?v=TRACKS1"></script>
  <script>
(function () {
  "use strict";

  var STORAGE_KEY = "innotech-staff-progress-matrix-v2";
  var LEGACY_V1 = "innotech-staff-progress-matrix-v1";
  var LEGACY_V3 = "innotech-staff-progress-v3";
  var cfg = window.ProgressConfig || {};
  var WEEK_COUNT = cfg.WEEK_COUNT || 18;
  var CLASSES = cfg.CLASSES || [];
  var sheetUrl = String(cfg.SHEET_CSV_URL || "").trim();
  var sheetFallback = String(cfg.SHEET_CSV_FALLBACK || "").trim();
  var appsScriptUrl = String(cfg.APPS_SCRIPT_URL || "").trim();
  var writeToken = String(cfg.WRITE_TOKEN || "").trim();
  var sheetMode = false;
  var sheetDataOk = false;
  var saveTimer = null;
  var cellWriteTimers = {};

  function canWriteSheet() {
    return !!(appsScriptUrl && writeToken && writeToken !== "REPLACE_ME");
  }

  function postAppsScript(payload) {
    if (!canWriteSheet()) {
      return Promise.reject(new Error("未接寫入（未設 APPS_SCRIPT_URL／WRITE_TOKEN）"));
    }
    var body = Object.assign({ token: writeToken, board: "progress" }, payload || {});
    return fetch(appsScriptUrl, {
      method: "POST",
      mode: "cors",
      redirect: "follow",
      credentials: "omit",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body),
    }).then(function (res) {
      return res.text().then(function (t) {
        var data = null;
        try { data = JSON.parse(t); } catch (e) {}
        if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
        if (!data || !data.ok) throw new Error((data && data.error) || "寫入失敗");
        return data;
      });
    });
  }

  function queueProgressCell(week, classShort, track, text) {
    var key = classShort + ":" + track + ":" + week;
    if (cellWriteTimers[key]) clearTimeout(cellWriteTimers[key]);
    document.getElementById("mode-stamp").textContent = "寫入 Sheet…";
    cellWriteTimers[key] = setTimeout(function () {
      postAppsScript({
        action: "setCell",
        week: week,
        class: classShort,
        track: track,
        text: text,
      })
        .then(function () {
          setStamp();
          showNote("已寫入 Sheet：第" + week + "週 · " + classShort + " " + track, false);
        })
        .catch(function (err) {
          setStamp();
          showNote("寫入失敗：" + (err && err.message ? err.message : "未知錯誤"), true);
        });
    }, 600);
  }

  function tracksOf(c) {
    if (c && c.tracks && c.tracks.length) return c.tracks.slice();
    return ["電腦", "工場"];
  }

  function classById(id) {
    var found = null;
    CLASSES.forEach(function (c) {
      if (c.id === id) found = c;
    });
    return found;
  }

  function legacyTrackFor(classId) {
    var map = cfg.LEGACY_TRACK || {};
    if (map[classId]) return map[classId];
    var c = classById(classId);
    var tracks = tracksOf(c);
    if (tracks.length === 1) return tracks[0];
    return "電腦";
  }

  function blankGrid() {
    var cells = {};
    CLASSES.forEach(function (c) {
      cells[c.id] = {};
      tracksOf(c).forEach(function (track) {
        cells[c.id][track] = {};
        for (var w = 1; w <= WEEK_COUNT; w++) cells[c.id][track][w] = "";
      });
    });
    return { version: 2, cells: cells, updatedAt: null };
  }

  function isPlainObject(v) {
    return !!v && typeof v === "object" && !Array.isArray(v);
  }

  function bucketMode(bucket) {
    if (!isPlainObject(bucket)) return "empty";
    var keys = Object.keys(bucket);
    var i;
    for (i = 0; i < keys.length; i++) {
      if (exactTrack(keys[i])) return "tracks";
    }
    for (i = 0; i < keys.length; i++) {
      if (/^\d+$/.test(keys[i])) return "weeks";
    }
    return "empty";
  }

  /** Copy stored cells. Legacy week maps land on LEGACY_TRACK so old text stays visible. */
  function applyStoredCells(grid, cells) {
    if (!cells || typeof cells !== "object") return grid;
    CLASSES.forEach(function (c) {
      var bucket = cells[c.id];
      var mode = bucketMode(bucket);
      if (mode === "tracks") {
        tracksOf(c).forEach(function (track) {
          var weeks = bucket[track];
          if (!isPlainObject(weeks)) return;
          for (var w = 1; w <= WEEK_COUNT; w++) {
            if (weeks[w] != null) grid.cells[c.id][track][w] = String(weeks[w]);
          }
        });
        return;
      }
      if (mode === "weeks") {
        var track = legacyTrackFor(c.id);
        if (!grid.cells[c.id][track]) return;
        for (var w2 = 1; w2 <= WEEK_COUNT; w2++) {
          if (bucket[w2] != null) grid.cells[c.id][track][w2] = String(bucket[w2]);
        }
      }
    });
    return grid;
  }

  function softMigrateV3(raw) {
    var grid = blankGrid();
    if (!raw || !Array.isArray(raw.classes)) return grid;
    raw.classes.forEach(function (oc) {
      var match = null;
      CLASSES.forEach(function (c) {
        if (oc.id === "preset-" + c.id || oc.short === c.short || (oc.name && oc.name.indexOf(c.short) === 0)) {
          match = c;
        }
      });
      if (!match || !Array.isArray(oc.weeks)) return;
      var track = legacyTrackFor(match.id);
      oc.weeks.forEach(function (ow) {
        if (!ow || !ow.n || ow.n < 1 || ow.n > WEEK_COUNT) return;
        var parts = [];
        if (ow.label) parts.push(ow.label);
        if (ow.dates) parts.push(ow.dates);
        if (ow.body) parts.push(ow.body);
        grid.cells[match.id][track][ow.n] = parts.join(" · ");
      });
    });
    return grid;
  }

  function readStoredGrid(key) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || !data.cells) return null;
      var grid = blankGrid();
      applyStoredCells(grid, data.cells);
      grid.updatedAt = data.updatedAt || null;
      return grid;
    } catch (e) {
      return null;
    }
  }

  function loadLocal() {
    var v3grid = null;
    try {
      var v3 = localStorage.getItem(LEGACY_V3);
      if (v3) v3grid = softMigrateV3(JSON.parse(v3));
    } catch (e) {}
    return readStoredGrid(STORAGE_KEY) || readStoredGrid(LEGACY_V1) || v3grid || blankGrid();
  }

  function persistLocal(immediate) {
    if (sheetMode) return;
    function write() {
      state.updatedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 2,
        cells: state.cells,
        updatedAt: state.updatedAt,
      }));
      setStamp();
    }
    if (immediate) {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = null;
      write();
      return;
    }
    document.getElementById("mode-stamp").textContent = "儲存中…";
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(write, 400);
  }

  function setStamp() {
    var el = document.getElementById("mode-stamp");
    if (sheetMode) {
      el.textContent = canWriteSheet()
        ? "來源：Google Sheet（可編輯寫入）"
        : "來源：Google Sheet（唯讀）";
      return;
    }
    if (sheetUrl) {
      el.textContent = canWriteSheet() ? "Sheet 模式（可寫入）" : "Sheet 模式（唯讀）";
      return;
    }
    if (!state.updatedAt) {
      el.textContent = "本機模式";
      return;
    }
    try {
      var d = new Date(state.updatedAt);
      el.textContent =
        "本機已存 · " +
        d.toLocaleString("zh-HK", {
          timeZone: "Asia/Hong_Kong",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
    } catch (e) {
      el.textContent = "本機已存";
    }
  }

  function parseCsv(text) {
    var rows = [];
    var i = 0;
    var field = "";
    var row = [];
    var inQ = false;
    text = String(text || "").replace(/^\uFEFF/, "");
    while (i < text.length) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i += 2;
            continue;
          }
          inQ = false;
          i++;
          continue;
        }
        field += ch;
        i++;
        continue;
      }
      if (ch === '"') {
        inQ = true;
        i++;
        continue;
      }
      if (ch === ",") {
        row.push(field);
        field = "";
        i++;
        continue;
      }
      if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field);
        field = "";
        if (row.length > 1 || (row[0] && String(row[0]).trim())) rows.push(row);
        row = [];
        i++;
        continue;
      }
      field += ch;
      i++;
    }
    if (field.length || row.length) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  function exactTrack(raw) {
    var s = String(raw || "").replace(/\s+/g, "");
    if (!s) return "";
    var map = {
      "電腦": "電腦",
      "电脑": "電腦",
      "PC": "電腦",
      "pc": "電腦",
      "工場": "工場",
      "工廠": "工場",
      "工厂": "工場",
      "數學": "數學",
      "数学": "數學",
      "MATH": "數學",
      "math": "數學",
    };
    if (map[s]) return map[s];
    var up = s.toUpperCase();
    if (map[up]) return map[up];
    return "";
  }

  /** "1A", "1C 數學", "1C數學" → { short, track }. */
  function parseClassHeader(raw) {
    var compact = String(raw || "").replace(/\s+/g, "");
    if (!compact) return null;
    var m = compact.match(/^(1A|1B|1C|2A|2B|3B)/i);
    if (!m) return null;
    var short = m[1].toUpperCase();
    return { short: short, track: exactTrack(compact.slice(m[1].length)) };
  }

  function findClassByShort(short) {
    var parsed = parseClassHeader(short);
    if (!parsed) return null;
    var found = null;
    CLASSES.forEach(function (c) {
      if (c.short === parsed.short) found = c;
    });
    return found;
  }

  function parseWeekNum(label, fallback) {
    var m = String(label || "").match(/(\d+)/);
    if (m) {
      var n = parseInt(m[1], 10);
      if (n >= 1 && n <= WEEK_COUNT) return n;
    }
    if (fallback >= 1 && fallback <= WEEK_COUNT) return fallback;
    return 0;
  }

  function headerLooksLikeClasses(header) {
    var hits = 0;
    for (var i = 1; i < header.length; i++) {
      if (findClassByShort(header[i])) hits++;
    }
    return hits >= 2;
  }

  function rowLooksLikeWeek(row) {
    var label = String((row && row[0]) || "").trim();
    if (/^w\s*\d+/i.test(label)) return true;
    if (/^\d+$/.test(label)) return true;
    if (/第\s*\d+\s*週/.test(label)) return true;
    return false;
  }

  function rowLooksLikeTrackHeader(row) {
    if (!row || rowLooksLikeWeek(row)) return false;
    var hits = 0;
    for (var i = 1; i < row.length; i++) {
      if (exactTrack(row[i])) hits++;
    }
    return hits >= 2;
  }

  /** Merged (1A, "") or repeated (1A, 1A) class headers — at least one pair. */
  function headerLooksPaired(header) {
    var last = "";
    var pairs = 0;
    for (var i = 1; i < header.length; i++) {
      var cell = String(header[i] || "").trim();
      var parsed = parseClassHeader(cell);
      if (!cell) {
        if (last) pairs++;
        continue;
      }
      if (parsed && parsed.short === last) pairs++;
      if (parsed) last = parsed.short;
      else last = "";
    }
    return pairs >= 2;
  }

  function applyCsv(text) {
    var rows = parseCsv(text);
    if (!rows.length) throw new Error("CSV 空白");
    var grid = blankGrid();
    var header = rows[0].map(function (x) { return String(x || "").trim(); });
    var h0 = header[0] || "";

    /* Weeks × classes. Two-row header: class spans + 電腦/工場 (1C = 數學). */
    if (headerLooksLikeClasses(header) || /週|week|^w$/i.test(h0)) {
      var classCols = [];
      var twoRow = rows.length > 1 && !rowLooksLikeWeek(rows[1]) &&
        (rowLooksLikeTrackHeader(rows[1]) || headerLooksPaired(header));
      var trackRow = twoRow ? rows[1] : null;
      var startData = twoRow ? 2 : 1;
      var lastShort = "";
      var seen = {};
      for (var c = 1; c < Math.max(header.length, trackRow ? trackRow.length : 0); c++) {
        var cell = header[c] || "";
        var parsed = parseClassHeader(cell);
        if (parsed) lastShort = parsed.short;
        else if (String(cell).trim()) lastShort = "";
        if (!lastShort) continue;
        var cls = findClassByShort(lastShort);
        if (!cls) continue;
        var track = "";
        if (twoRow) {
          track = exactTrack(trackRow[c]);
          if (!track && parsed && parsed.track) track = parsed.track;
          if (!track && lastShort === "1C") track = "數學";
          if (!track) {
            var classTracks = tracksOf(cls);
            var n = seen[lastShort] || 0;
            if (classTracks[n]) track = classTracks[n];
          }
        } else {
          track = (parsed && parsed.track) || legacyTrackFor(cls.id);
        }
        if (!track) continue;
        if (tracksOf(cls).indexOf(track) < 0) continue;
        seen[lastShort] = (seen[lastShort] || 0) + 1;
        classCols.push({ col: c, cls: cls, track: track });
      }
      if (!classCols.length) throw new Error("CSV 未辨識班別欄");
      for (var r = startData; r < rows.length; r++) {
        var week = parseWeekNum(rows[r][0], r - startData + 1);
        if (!week) continue;
        classCols.forEach(function (cc) {
          var val = rows[r][cc.col];
          grid.cells[cc.cls.id][cc.track][week] = val == null ? "" : String(val);
        });
      }
      return grid;
    }

    /* Legacy fallback: classes × weeks — header 班別 + W1…W18 */
    var weekCols = [];
    for (var c2 = 1; c2 < header.length; c2++) {
      var n = parseWeekNum(header[c2], c2);
      if (n) weekCols.push({ col: c2, week: n });
    }
    if (!weekCols.length) {
      for (var w = 1; w <= WEEK_COUNT && w < header.length; w++) {
        weekCols.push({ col: w, week: w });
      }
    }
    for (var r2 = 1; r2 < rows.length; r2++) {
      var cls2 = findClassByShort(rows[r2][0]);
      if (!cls2) continue;
      var legacyTrack = legacyTrackFor(cls2.id);
      if (!grid.cells[cls2.id][legacyTrack]) continue;
      weekCols.forEach(function (wc) {
        var val2 = rows[r2][wc.col];
        grid.cells[cls2.id][legacyTrack][wc.week] = val2 == null ? "" : String(val2);
      });
    }
    return grid;
  }

  function applyWeek9Defaults(grid) {
    var seeds = cfg.WEEK9_DEFAULTS || {};
    var changed = false;
    Object.keys(seeds).forEach(function (cid) {
      var spec = seeds[cid];
      if (spec == null) return;
      if (typeof spec === "string") {
        var only = {};
        only[legacyTrackFor(cid)] = spec;
        spec = only;
      }
      if (!grid.cells[cid]) grid.cells[cid] = {};
      Object.keys(spec).forEach(function (track) {
        if (!grid.cells[cid][track]) grid.cells[cid][track] = {};
        var cur = grid.cells[cid][track][9];
        if (cur == null || !String(cur).trim()) {
          grid.cells[cid][track][9] = String(spec[track]);
          changed = true;
        }
      });
    });
    grid.__week9Seeded = changed;
    return grid;
  }

  var state = applyWeek9Defaults(loadLocal());

  var fitResizeTimer = null;
  var fitResizeBound = false;

  function fitArea(ta) {
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + "px";
  }

  function fitAllAreas() {
    var areas = document.querySelectorAll(".matrix-input");
    for (var i = 0; i < areas.length; i++) fitArea(areas[i]);
  }

  function bindFitResize() {
    if (fitResizeBound) return;
    fitResizeBound = true;
    window.addEventListener("resize", function () {
      if (fitResizeTimer) clearTimeout(fitResizeTimer);
      fitResizeTimer = setTimeout(fitAllAreas, 80);
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitAllAreas);
    }
  }

  function renderMatrix() {
    var head = document.getElementById("matrix-head");
    var body = document.getElementById("matrix-body");
    head.innerHTML = "";
    body.innerHTML = "";

    var classTr = document.createElement("tr");
    classTr.className = "matrix-classes";
    var trackTr = document.createElement("tr");
    trackTr.className = "matrix-tracks";

    var corner = document.createElement("th");
    corner.className = "sticky-col";
    corner.rowSpan = 2;
    corner.scope = "col";
    corner.textContent = "週次";
    classTr.appendChild(corner);

    CLASSES.forEach(function (c) {
      var tracks = tracksOf(c);
      var th = document.createElement("th");
      th.className = "matrix-class-head matrix-group-end";
      th.scope = "colgroup";
      if (tracks.length === 1) {
        th.rowSpan = 2;
        th.textContent = c.header || (c.short + " " + tracks[0]);
      } else {
        th.colSpan = tracks.length;
        th.textContent = c.short;
        tracks.forEach(function (track, i) {
          var sth = document.createElement("th");
          sth.className = "matrix-track-head" + (i === tracks.length - 1 ? " matrix-group-end" : "");
          sth.scope = "col";
          sth.textContent = track;
          trackTr.appendChild(sth);
        });
      }
      classTr.appendChild(th);
    });
    head.appendChild(classTr);
    head.appendChild(trackTr);

    for (var week = 1; week <= WEEK_COUNT; week++) {
      (function (wn) {
        var tr = document.createElement("tr");
        var th = document.createElement("th");
        th.className = "sticky-col";
        th.scope = "row";
        th.innerHTML =
          '<span class="matrix-class">W' +
          wn +
          '</span><span class="matrix-days">第' +
          wn +
          "週</span>";
        tr.appendChild(th);

        CLASSES.forEach(function (c) {
          var tracks = tracksOf(c);
          tracks.forEach(function (track, ti) {
            (function (cid, short, trackName, groupEnd) {
              if (!state.cells[cid]) state.cells[cid] = {};
              if (!state.cells[cid][trackName]) state.cells[cid][trackName] = {};
              var td = document.createElement("td");
              var val = state.cells[cid][trackName][wn] || "";
              var tone = trackName === "工場" ? " is-workshop" : "";
              var edge = groupEnd ? " matrix-group-end" : "";
              if (sheetMode && !canWriteSheet()) {
                td.className = "matrix-cell" + tone + edge + (val ? " is-filled" : "");
                td.textContent = val;
                td.title = val;
              } else {
                var ta = document.createElement("textarea");
                ta.className = "matrix-input";
                ta.rows = 2;
                ta.value = val;
                ta.setAttribute("aria-label", "第" + wn + "週 " + short + " " + trackName);
                ta.addEventListener("input", function () {
                  state.cells[cid][trackName][wn] = ta.value;
                  td.classList.toggle("is-filled", !!String(ta.value).trim());
                  fitArea(ta);
                  if (sheetMode) {
                    queueProgressCell(wn, short, trackName, ta.value);
                  } else {
                    persistLocal();
                  }
                });
                td.className = "matrix-cell" + tone + edge + (val ? " is-filled" : "");
                td.appendChild(ta);
                fitArea(ta);
              }
              tr.appendChild(td);
            })(c.id, c.short, track, ti === tracks.length - 1);
          });
        });
        body.appendChild(tr);
      })(week);
    }
    fitAllAreas();
    bindFitResize();
  }

  function showNote(msg, isErr) {
    var note = document.getElementById("sheet-note");
    if (!msg) {
      note.hidden = true;
      note.textContent = "";
      return;
    }
    note.hidden = false;
    note.textContent = msg;
    note.classList.toggle("is-err", !!isErr);
  }

  function setChromeForMode() {
    var locked = !!sheetUrl || sheetMode;
    var reload = document.getElementById("btn-reload-sheet");
    var exp = document.getElementById("btn-export");
    var imp = document.getElementById("btn-import-wrap");
    if (reload) reload.hidden = !locked;
    if (exp) exp.hidden = locked;
    if (imp) imp.hidden = locked;
  }

  function enterLocalMode(note) {
    sheetMode = false;
    sheetDataOk = false;
    if (state && state.__week9Seeded) {
      persistLocal(true);
      state.__week9Seeded = false;
    }
    setChromeForMode();
    showNote(note || "");
    setStamp();
    renderMatrix();
  }

  function enterSheetMode(grid) {
    sheetMode = true;
    sheetDataOk = true;
    state = grid;
    setChromeForMode();
    showNote("");
    setStamp();
    renderMatrix();
  }

  /** Sheet URL configured: stay locked read-only; never fall back to editable localStorage. */
  function enterSheetFailure(err) {
    sheetMode = true;
    if (!sheetDataOk) state = blankGrid();
    setChromeForMode();
    showNote(
      "無法載入 Sheet（" +
        (err && err.message ? err.message : "錯誤") +
        "）。請確認 Sheet 已 Share →「知道連結的使用者可檢視」，並檢查 export URL／CORS，然後撳「重新載入 Sheet」。",
      true
    );
    setStamp();
    renderMatrix();
  }


  function parseSheetRef(url) {
    var u = String(url || "");
    var id = null;
    var gid = null;
    var m = u.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    if (m && m[1] !== "e") id = m[1];
    var g = u.match(/[?&#]gid=([0-9]+)/);
    if (g) gid = g[1];
    return { id: id, gid: gid };
  }

  function csvEscapeCell(s) {
    s = String(s == null ? "" : s);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function assertCsvText(text) {
    text = String(text || "");
    var head = text.slice(0, 200).replace(/^\uFEFF/, "");
    if (/^\s*</.test(head) || /accounts\.google\.com/i.test(head) || /ServiceLogin/i.test(head)) {
      throw new Error("需要登入／Sheet 未設「知道連結的使用者可檢視」");
    }
    if (!head.trim()) throw new Error("CSV 空白");
    return text;
  }

  function fetchCsvText(url) {
    return fetch(url, { cache: "no-store", mode: "cors", credentials: "omit" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }).then(assertCsvText);
  }

  function gvizTableToCsv(data) {
    var table = data && data.table;
    if (!table) throw new Error("gviz 無 table");
    function cellVal(c) {
      if (!c) return "";
      if (c.f != null && String(c.f) !== "") return String(c.f);
      if (c.v == null) return "";
      return String(c.v);
    }
    var cols = table.cols || [];
    var rows = table.rows || [];
    /* Keep blank labels blank so a merged class header can forward-fill.
       Falling back to col.id ("B", "C"…) would look like a real header. */
    var headers = cols.map(function (col) {
      if (!col || col.label == null) return "";
      return String(col.label);
    });
    var start = 0;
    if (headers.every(function (h) { return !String(h).trim(); }) && rows.length) {
      headers = (rows[0].c || []).map(cellVal);
      start = 1;
    }
    var lines = [headers.map(csvEscapeCell).join(",")];
    for (var i = start; i < rows.length; i++) {
      var cells = rows[i].c || [];
      var vals = [];
      for (var j = 0; j < headers.length; j++) vals.push(csvEscapeCell(cellVal(cells[j])));
      lines.push(vals.join(","));
    }
    return assertCsvText(lines.join("\n"));
  }

  function fetchGvizJsonp(sheetId, gid) {
    return new Promise(function (resolve, reject) {
      var cb = "_sheetGviz" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
      var script = document.createElement("script");
      var done = false;
      function cleanup() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      var timer = setTimeout(function () {
        cleanup();
        reject(new Error("gviz JSONP timeout"));
      }, 20000);
      window[cb] = function (payload) {
        cleanup();
        try {
          resolve(gvizTableToCsv(payload));
        } catch (err) {
          reject(err);
        }
      };
      script.async = true;
      script.onerror = function () {
        cleanup();
        reject(new Error("gviz JSONP network error"));
      };
      var src =
        "https://docs.google.com/spreadsheets/d/" +
        encodeURIComponent(sheetId) +
        "/gviz/tq?tqx=out:json;responseHandler:" +
        cb;
      if (gid != null && gid !== "") src += "&gid=" + encodeURIComponent(gid);
      script.src = src;
      document.head.appendChild(script);
    });
  }

  function buildSheetCandidates(primary, fallback) {
    var urls = [];
    function add(u) {
      if (!u) return;
      u = String(u).trim();
      if (!u) return;
      if (urls.indexOf(u) < 0) urls.push(u);
    }
    add(primary);
    var ref = parseSheetRef(primary);
    if (ref.id) {
      add(
        "https://docs.google.com/spreadsheets/d/" +
          ref.id +
          "/export?format=csv" +
          (ref.gid != null ? "&gid=" + ref.gid : "")
      );
      add(
        "https://docs.google.com/spreadsheets/d/" +
          ref.id +
          "/gviz/tq?tqx=out:csv" +
          (ref.gid != null ? "&gid=" + ref.gid : "")
      );
    }
    add(fallback);
    return { urls: urls, ref: ref };
  }

  function loadSheetCsvText(primary, fallback) {
    var pack = buildSheetCandidates(primary, fallback);
    function nextFetch(i) {
      if (i >= pack.urls.length) {
        if (pack.ref.id) return fetchGvizJsonp(pack.ref.id, pack.ref.gid);
        return Promise.reject(new Error("Failed to fetch"));
      }
      return fetchCsvText(pack.urls[i]).catch(function () {
        return nextFetch(i + 1);
      });
    }
    return nextFetch(0);
  }

  function loadSheet() {
    if (!sheetUrl) {
      enterLocalMode();
      return;
    }
    setChromeForMode();
    document.getElementById("mode-stamp").textContent = "載入 Sheet…";
    loadSheetCsvText(sheetUrl, sheetFallback)
      .then(function (text) {
        enterSheetMode(applyCsv(text));
      })
      .catch(function (err) {
        enterSheetFailure(err);
      });
  }

  function initUi() {
    document.getElementById("btn-logout").addEventListener("click", function () {
      StaffAuth.logout();
      location.reload();
    });
    document.getElementById("btn-reload-sheet").addEventListener("click", loadSheet);

    document.getElementById("btn-export").addEventListener("click", function () {
      if (!sheetMode) persistLocal(true);
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "innotech-progress-matrix-backup.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    document.getElementById("import-file").addEventListener("change", function (e) {
      if (sheetMode) return;
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(String(reader.result || ""));
          if (!data || !data.cells) throw new Error("格式不正確");
          if (!confirm("匯入會覆蓋本機進度矩陣，確定？")) return;
          var base = blankGrid();
          applyStoredCells(base, data.cells);
          state = base;
          persistLocal(true);
          renderMatrix();
        } catch (err) {
          alert("匯入失敗：" + (err.message || "未知錯誤"));
        }
      };
      reader.readAsText(file);
    });

    loadSheet();
  }

  StaffAuth.requireAuth({ onUnlock: initUi });
})();
  </script>
</body>
