<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>課堂進度 · 職員區</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../staff.css" />
</head>
<body>
  <div id="staff-gate"></div>

  <div id="staff-app" hidden>
    <div class="wrap">
      <header class="topbar">
        <a class="topbar__brand" href="../">← 職員區</a>
        <div class="topbar__spacer"></div>
        <div class="topbar__actions">
          <button type="button" class="btn btn-sm" id="btn-export">匯出 JSON</button>
          <label class="btn btn-sm" style="cursor:pointer;margin:0">
            匯入 JSON
            <input type="file" id="import-file" accept="application/json,.json" class="sr-only" />
          </label>
          <button type="button" class="btn btn-sm" id="btn-logout">登出</button>
        </div>
      </header>

      <div class="prog-hero">
        <div>
          <h1>課堂進度</h1>
          <p class="muted" style="margin:0.25rem 0 0">以<strong>班別</strong>同<strong>星期</strong>為單位。登入後可直接加／改／刪，自動儲存本機。唔存學生姓名。</p>
        </div>
        <p class="stamp" id="save-stamp"><span class="autosave-dot" id="save-dot" hidden></span><span id="save-text">尚未有內容</span></p>
      </div>

      <section class="card" style="padding-bottom:0.85rem">
        <p class="section-label">班別</p>
        <div class="class-tabs" id="class-tabs"></div>
        <div class="row" id="class-actions">
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-class">＋ 新增班別</button>
          <button type="button" class="btn btn-sm" id="btn-rename-class" disabled>改名</button>
          <button type="button" class="btn btn-danger btn-sm" id="btn-del-class" disabled>刪除班別</button>
        </div>
      </section>

      <div id="weeks-panel">
        <div class="row" style="margin-bottom:0.75rem;justify-content:space-between">
          <p class="section-label" style="margin:0">各週進度</p>
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-week" disabled>＋ 新增一週</button>
        </div>
        <div class="week-list" id="week-list"></div>
        <div class="prog-empty" id="empty-no-class">
          <strong>尚未有班別</strong>
          按「新增班別」開始（例如 1A）。內容全空，由你之後填寫。
        </div>
        <div class="prog-empty" id="empty-no-weeks" hidden>
          <strong>呢個班未有星期</strong>
          按「新增一週」加入第 1 週，再填進度內容。
        </div>
      </div>

      <p class="footnote">靜態 GitHub Pages 嘅前端密碼唔係銀行級保安；靠私人連結＋密碼＋資料留喺本機瀏覽器。日常喺瀏覽器直接改；匯出 JSON 作備份。</p>
    </div>
  </div>

  <script src="../auth.js"></script>
  <script>
(function () {
  "use strict";

  var STORAGE_KEY = "innotech-staff-progress-v2";
  var saveTimer = null;

  function uid() {
    return "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
  }

  function blankState() {
    return { version: 2, classes: [], activeClassId: null, updatedAt: null };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        // migrate legacy single-doc if present
        var legacy = localStorage.getItem("innotech-staff-progress");
        if (legacy) {
          try {
            var old = JSON.parse(legacy);
            if (old && (old.body || old.title)) {
              var c = {
                id: uid(),
                name: "預設班別",
                weeks: [
                  {
                    id: uid(),
                    n: 1,
                    label: old.title || "",
                    dates: "",
                    body: old.body || "",
                  },
                ],
              };
              return {
                version: 2,
                classes: [c],
                activeClassId: c.id,
                updatedAt: old.updatedAt || null,
              };
            }
          } catch (e) {}
        }
        return blankState();
      }
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.classes)) return blankState();
      data.version = 2;
      return data;
    } catch (e) {
      return blankState();
    }
  }

  function persist(immediate) {
    function write() {
      state.updatedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setStamp(true);
    }
    if (immediate) {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = null;
      write();
      return;
    }
    setStamp(false);
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(write, 400);
  }

  function setStamp(saved) {
    var dot = document.getElementById("save-dot");
    var text = document.getElementById("save-text");
    dot.hidden = false;
    if (!saved) {
      dot.classList.add("is-pending");
      text.textContent = "儲存中…";
      return;
    }
    dot.classList.remove("is-pending");
    if (!state.updatedAt) {
      text.textContent = "尚未有內容";
      return;
    }
    try {
      var d = new Date(state.updatedAt);
      text.textContent =
        "已自動儲存 · " +
        d.toLocaleString("zh-HK", {
          timeZone: "Asia/Hong_Kong",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }) +
        "（香港時間）";
    } catch (e) {
      text.textContent = "已自動儲存";
    }
  }

  var state = load();

  function activeClass() {
    if (!state.activeClassId) return null;
    for (var i = 0; i < state.classes.length; i++) {
      if (state.classes[i].id === state.activeClassId) return state.classes[i];
    }
    return null;
  }

  function renumberWeeks(cls) {
    (cls.weeks || []).forEach(function (w, i) {
      w.n = i + 1;
    });
  }

  function renderClassTabs() {
    var tabs = document.getElementById("class-tabs");
    tabs.innerHTML = "";
    state.classes.forEach(function (c) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "class-tab" + (c.id === state.activeClassId ? " is-active" : "");
      btn.textContent = c.name;
      btn.addEventListener("click", function () {
        state.activeClassId = c.id;
        persist(true);
        renderAll();
      });
      tabs.appendChild(btn);
    });
    var has = !!activeClass();
    document.getElementById("btn-rename-class").disabled = !has;
    document.getElementById("btn-del-class").disabled = !has;
    document.getElementById("btn-add-week").disabled = !has;
  }

  function renderWeeks() {
    var list = document.getElementById("week-list");
    var emptyClass = document.getElementById("empty-no-class");
    var emptyWeeks = document.getElementById("empty-no-weeks");
    list.innerHTML = "";
    var cls = activeClass();
    if (!state.classes.length) {
      emptyClass.hidden = false;
      emptyWeeks.hidden = true;
      return;
    }
    emptyClass.hidden = true;
    if (!cls || !(cls.weeks || []).length) {
      emptyWeeks.hidden = false;
      return;
    }
    emptyWeeks.hidden = true;

    cls.weeks.forEach(function (w, idx) {
      var card = document.createElement("article");
      card.className = "week-card";
      card.dataset.weekId = w.id;

      var head = document.createElement("div");
      head.className = "week-card__head";

      var badge = document.createElement("span");
      badge.className = "week-card__badge";
      badge.textContent = "第 " + w.n + " 週";
      head.appendChild(badge);

      var meta = document.createElement("div");
      meta.className = "week-card__meta";

      var labelIn = document.createElement("input");
      labelIn.type = "text";
      labelIn.className = "week-label";
      labelIn.placeholder = "主題／標題（選填）";
      labelIn.value = w.label || "";
      labelIn.addEventListener("input", function () {
        w.label = labelIn.value;
        persist();
      });
      meta.appendChild(labelIn);

      var datesIn = document.createElement("input");
      datesIn.type = "text";
      datesIn.className = "week-dates";
      datesIn.placeholder = "日期（選填）";
      datesIn.value = w.dates || "";
      datesIn.addEventListener("input", function () {
        w.dates = datesIn.value;
        persist();
      });
      meta.appendChild(datesIn);
      head.appendChild(meta);

      var actions = document.createElement("div");
      actions.className = "week-card__actions";

      var up = document.createElement("button");
      up.type = "button";
      up.className = "btn btn-sm";
      up.textContent = "↑";
      up.title = "上移";
      up.disabled = idx === 0;
      up.addEventListener("click", function () {
        if (idx === 0) return;
        var tmp = cls.weeks[idx - 1];
        cls.weeks[idx - 1] = cls.weeks[idx];
        cls.weeks[idx] = tmp;
        renumberWeeks(cls);
        persist(true);
        renderAll();
      });
      actions.appendChild(up);

      var down = document.createElement("button");
      down.type = "button";
      down.className = "btn btn-sm";
      down.textContent = "↓";
      down.title = "下移";
      down.disabled = idx === cls.weeks.length - 1;
      down.addEventListener("click", function () {
        if (idx >= cls.weeks.length - 1) return;
        var tmp = cls.weeks[idx + 1];
        cls.weeks[idx + 1] = cls.weeks[idx];
        cls.weeks[idx] = tmp;
        renumberWeeks(cls);
        persist(true);
        renderAll();
      });
      actions.appendChild(down);

      var del = document.createElement("button");
      del.type = "button";
      del.className = "btn btn-danger btn-sm";
      del.textContent = "刪週";
      del.addEventListener("click", function () {
        if (!confirm("刪除第 " + w.n + " 週？")) return;
        cls.weeks = cls.weeks.filter(function (x) { return x.id !== w.id; });
        renumberWeeks(cls);
        persist(true);
        renderAll();
      });
      actions.appendChild(del);
      head.appendChild(actions);
      card.appendChild(head);

      var body = document.createElement("div");
      body.className = "week-card__body";
      var ta = document.createElement("textarea");
      ta.placeholder = "喺度寫本週進度（例如教咗咩、功課、備註）。純文字即可。";
      ta.value = w.body || "";
      ta.addEventListener("input", function () {
        w.body = ta.value;
        persist();
      });
      body.appendChild(ta);

      var foot = document.createElement("div");
      foot.className = "week-card__foot";
      var hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = "改完會自動儲存到本機瀏覽器";
      foot.appendChild(hint);
      body.appendChild(foot);
      card.appendChild(body);

      list.appendChild(card);
    });
  }

  function renderAll() {
    renderClassTabs();
    renderWeeks();
    if (state.updatedAt) setStamp(true);
  }

  function initUi() {
    document.getElementById("btn-logout").addEventListener("click", function () {
      StaffAuth.logout();
      location.reload();
    });

    document.getElementById("btn-add-class").addEventListener("click", function () {
      var name = prompt("班別名稱（例如 1A、2B）");
      if (name == null) return;
      name = String(name).trim();
      if (!name) return;
      var c = { id: uid(), name: name, weeks: [] };
      state.classes.push(c);
      state.activeClassId = c.id;
      persist(true);
      renderAll();
    });

    document.getElementById("btn-rename-class").addEventListener("click", function () {
      var cls = activeClass();
      if (!cls) return;
      var name = prompt("班別新名稱", cls.name);
      if (name == null) return;
      name = String(name).trim();
      if (!name) return;
      cls.name = name;
      persist(true);
      renderAll();
    });

    document.getElementById("btn-del-class").addEventListener("click", function () {
      var cls = activeClass();
      if (!cls) return;
      if (!confirm("刪除班別「" + cls.name + "」同埋所有星期內容？")) return;
      state.classes = state.classes.filter(function (c) { return c.id !== cls.id; });
      state.activeClassId = state.classes.length ? state.classes[0].id : null;
      persist(true);
      renderAll();
    });

    document.getElementById("btn-add-week").addEventListener("click", function () {
      var cls = activeClass();
      if (!cls) return;
      cls.weeks = cls.weeks || [];
      cls.weeks.push({
        id: uid(),
        n: cls.weeks.length + 1,
        label: "",
        dates: "",
        body: "",
      });
      renumberWeeks(cls);
      persist(true);
      renderAll();
      var cards = document.querySelectorAll(".week-card");
      if (cards.length) {
        var last = cards[cards.length - 1];
        last.scrollIntoView({ behavior: "smooth", block: "center" });
        var ta = last.querySelector("textarea");
        if (ta) ta.focus();
      }
    });

    document.getElementById("btn-export").addEventListener("click", function () {
      persist(true);
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "innotech-progress-backup.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    document.getElementById("import-file").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(String(reader.result || ""));
          if (!data || typeof data !== "object") throw new Error("格式不正確");
          if (!confirm("匯入會覆蓋本機現有進度，確定？")) return;
          if (Array.isArray(data.classes)) {
            state = {
              version: 2,
              classes: data.classes,
              activeClassId: data.activeClassId || (data.classes[0] && data.classes[0].id) || null,
              updatedAt: data.updatedAt || new Date().toISOString(),
            };
          } else if (data.body != null || data.title != null) {
            // legacy single doc
            var c = {
              id: uid(),
              name: "匯入班別",
              weeks: [
                {
                  id: uid(),
                  n: 1,
                  label: data.title || "",
                  dates: "",
                  body: data.body || "",
                },
              ],
            };
            state = {
              version: 2,
              classes: [c],
              activeClassId: c.id,
              updatedAt: data.updatedAt || new Date().toISOString(),
            };
          } else {
            throw new Error("缺少 classes");
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          renderAll();
          setStamp(true);
        } catch (err) {
          alert("匯入失敗：" + (err.message || "未知錯誤"));
        }
      };
      reader.readAsText(file);
    });

    renderAll();
  }

  StaffAuth.requireAuth({ onUnlock: initUi });
})();
  </script>
</body>
</html>
