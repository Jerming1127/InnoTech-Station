<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>創科站 · DT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="night">
    <header class="mast">
      <p class="mast__meta">HONG KONG · WAYFINDING</p>
      <h1 class="neon-title" data-text="創科站">創科站</h1>
      <p class="neon-sub">DT · 電腦 · 網頁設計</p>
    </header>

    <main>
      <section class="junction" aria-label="主目錄">
        <p class="junction__hint">請選擇前往方向 · SELECT DESTINATION</p>
        <nav class="signs" aria-label="暫定分頁">
          <a class="sign sign--blue" href="#classroom">
            <svg class="sign__arrow" viewBox="-4 0 8 16" width="76" height="38" aria-hidden="true"><path fill="#fff" d="M0 0 L4 4 L4 8 L1.333 5.333 L1.333 16 L-1.333 16 L-1.333 5.333 L-4 8 L-4 4 Z" transform="rotate(90 0 8)"/></svg>
            <span class="sign__stack">
              <span class="sign__zh">課堂示範</span>
              <span class="sign__en">Classroom</span>
            </span>
            <span class="sign__exit">A1</span>
          </a>
          <a class="sign sign--blue" href="#practice">
            <svg class="sign__arrow" viewBox="-4 0 8 16" width="76" height="38" aria-hidden="true"><path fill="#fff" d="M0 0 L4 4 L4 8 L1.333 5.333 L1.333 16 L-1.333 16 L-1.333 5.333 L-4 8 L-4 4 Z" transform="rotate(90 0 8)"/></svg>
            <span class="sign__stack">
              <span class="sign__zh">互動練習</span>
              <span class="sign__en">Practice</span>
            </span>
            <span class="sign__exit">A2</span>
          </a>
          <a class="sign sign--green" href="#resources">
            <svg class="sign__arrow" viewBox="-4 0 8 16" width="76" height="38" aria-hidden="true"><path fill="#fff" d="M0 0 L4 4 L4 8 L1.333 5.333 L1.333 16 L-1.333 16 L-1.333 5.333 L-4 8 L-4 4 Z" transform="rotate(90 0 8)"/></svg>
            <span class="sign__stack">
              <span class="sign__zh">教學資源</span>
              <span class="sign__en">Resources</span>
            </span>
            <span class="sign__exit">E</span>
          </a>
          <a class="sign sign--blue" href="#gallery">
            <svg class="sign__arrow" viewBox="-4 0 8 16" width="76" height="38" aria-hidden="true"><path fill="#fff" d="M0 0 L4 4 L4 8 L1.333 5.333 L1.333 16 L-1.333 16 L-1.333 5.333 L-4 8 L-4 4 Z" transform="rotate(90 0 8)"/></svg>
            <span class="sign__stack">
              <span class="sign__zh">學生作品</span>
              <span class="sign__en">Gallery</span>
            </span>
            <span class="sign__exit">B</span>
          </a>
        </nav>
        <p class="junction__note">分頁名稱暫定，之後可改 · Tabs are placeholders</p>
      </section>

      <section class="board" id="about">
        <div class="board__plate">
          <h2 class="board__h">本站說明</h2>
          <p>呢度係創科／DT／電腦科網頁主頁草稿。大標題跟霓虹招牌感覺；目錄跟香港運輸署方向指示牌（藍＝一般方向，綠＝快速／重點）。</p>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span class="foot__dot" aria-hidden="true"></span>
      GitHub Pages · 靜態站 · 草稿 v0.4
    </footer>
  </div>
</body>
</html>
