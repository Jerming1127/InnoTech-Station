<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>創科站 · DT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="night">
    <header class="mast">
      <p class="mast__meta">HONG KONG · WAYFINDING</p>
      <h1 class="neon-title" data-text="創科站">創科站</h1>
      <p class="neon-sub">DT · 電腦 · 網頁設計</p>
    </header>

    <main>
      <section class="junction" aria-label="主目錄">
        <p class="junction__hint">請選擇前往方向 · SELECT DESTINATION</p>
        <!-- v0.5 橫細牌：StackArrow + 中英 + 編號出口（無 EXIT／出） -->
        <nav class="nav-grid" aria-label="暫定分頁">
          <!-- A1 blue -->
          <a class="nav-sign stack stack--blue" href="#classroom">
            <div class="stack__body">
              <svg class="stack-arrow" width="28" height="28" viewBox="-10 -2 20 20" aria-hidden="true">
                <g transform="rotate(90 0 8)">
                  <path fill="#fff" d="M0 0 L4 4 L4 8 L1.333 5.333 L1.333 16 L-1.333 16 L-1.333 5.333 L-4 8 L-4 4 Z"/>
                </g>
              </svg>
              <div class="stack__text">
                <span class="zh">課堂示範</span>
                <span class="en">Classroom</span>
              </div>
              <div class="exit-plate" aria-label="Exit A1"><span class="exit-plate__code">A1</span></div>
            </div>
          </a>
          <!-- A2 blue -->
          <a class="nav-sign stack stack--blue" href="#practice">
            <div class="stack__body">
              <svg class="stack-arrow" width="28" height="28" viewBox="-10 -2 20 20" aria-hidden="true">
                <g transform="rotate(90 0 8)">
                  <path fill="#fff" d="M0 0 L4 4 L4 8 L1.333 5.333 L1.333 16 L-1.333 16 L-1.333 5.333 L-4 8 L-4 4 Z"/>
                </g>
              </svg>
              <div class="stack__text">
                <span class="zh">互動練習</span>
                <span class="en">Practice</span>
              </div>
              <div class="exit-plate" aria-label="Exit A2"><span class="exit-plate__code">A2</span></div>
            </div>
          </a>
          <!-- E green -->
          <a class="nav-sign stack stack--green" href="#resources">
            <div class="stack__body">
              <svg class="stack-arrow" width="28" height="28" viewBox="-10 -2 20 20" aria-hidden="true">
                <g transform="rotate(90 0 8)">
                  <path fill="#fff" d="M0 0 L4 4 L4 8 L1.333 5.333 L1.333 16 L-1.333 16 L-1.333 5.333 L-4 8 L-4 4 Z"/>
                </g>
              </svg>
              <div class="stack__text">
                <span class="zh">教學資源</span>
                <span class="en">Resources</span>
              </div>
              <div class="exit-plate" aria-label="Exit E"><span class="exit-plate__code">E</span></div>
            </div>
          </a>
          <!-- B blue -->
          <a class="nav-sign stack stack--blue" href="#gallery">
            <div class="stack__body">
              <svg class="stack-arrow" width="28" height="28" viewBox="-10 -2 20 20" aria-hidden="true">
                <g transform="rotate(90 0 8)">
                  <path fill="#fff" d="M0 0 L4 4 L4 8 L1.333 5.333 L1.333 16 L-1.333 16 L-1.333 5.333 L-4 8 L-4 4 Z"/>
                </g>
              </svg>
              <div class="stack__text">
                <span class="zh">學生作品</span>
                <span class="en">Gallery</span>
              </div>
              <div class="exit-plate" aria-label="Exit B"><span class="exit-plate__code">B</span></div>
            </div>
          </a>
        </nav>
        <p class="junction__note">分頁名稱暫定，之後可改 · Tabs are placeholders</p>
      </section>

      <section class="board" id="about">
        <div class="board__plate">
          <h2 class="board__h">本站說明</h2>
          <p>呢度係創科／DT／電腦科網頁主頁草稿。大標題跟霓虹招牌感覺；目錄跟香港運輸署方向指示牌（藍＝一般方向，綠＝快速／重點）。</p>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span class="foot__dot" aria-hidden="true"></span>
      GitHub Pages · 靜態站 · 草稿 v0.5
    </footer>
  </div>
</body>
</html>
